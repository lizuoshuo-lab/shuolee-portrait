name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Ensure FFmpeg and OpenCV system libraries
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! dpkg-query -W -f='${Status}' libgl1 2>/dev/null | grep -q 'install ok installed'; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg libgl1
          fi
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q src/shuolee_portrait
      - run: bash -n deploy.sh scripts/setup_server.sh scripts/train.sh
      - run: python run_smplx.py train --help
      - run: bash scripts/setup_server.sh --help
      - run: bash deploy.sh --help
      - run: python watch.py --help
