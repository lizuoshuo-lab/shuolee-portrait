name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q src/shuolee_portrait
      - run: bash -n scripts/setup_server.sh scripts/train119.sh
      - run: python run119.py train --help
      - run: bash scripts/setup_server.sh --help
